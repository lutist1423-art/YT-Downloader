name: Bootstrap AWS infra (one-time)

# Manual, one-time (or occasional) run to create/update the AWS resources
# defined in infra/ via `cdk deploy`. Uses a temporary IAM user access key
# from repo secrets — delete AWS_BOOTSTRAP_ACCESS_KEY_ID /
# AWS_BOOTSTRAP_SECRET_ACCESS_KEY from the repo secrets once this has run
# successfully. Ongoing infra deploys (deploy-infra.yml) and frontend
# deploys (deploy-frontend.yml) use the OIDC roles this workflow creates,
# not these keys.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - working-directory: infra
        run: npm ci

      - working-directory: backend
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Bootstrap CDK (eu-central-1 + us-east-1)
        working-directory: infra
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "Bootstrapping account $ACCOUNT_ID"
          npx cdk bootstrap "aws://$ACCOUNT_ID/eu-central-1" "aws://$ACCOUNT_ID/us-east-1"

      - working-directory: infra
        run: npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json

      - name: Show stack outputs
        working-directory: infra
        run: |
          echo "## YtDownloader stack outputs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Copy these into **Settings > Secrets and variables > Actions > Variables** so the ongoing deploy workflows can use them (see README for the full list/names)." >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat cdk-outputs.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "----CDK-OUTPUTS-JSON----"
          cat cdk-outputs.json
          echo "----END-CDK-OUTPUTS-JSON----"
